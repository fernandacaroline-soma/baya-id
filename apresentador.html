<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Baya · Modo apresentador</title><style>
:root{--fs:28px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0E0F11;color:#F4F4F1;font-family:Inter,'Helvetica Neue',Arial,sans-serif}
body{padding:28px}.card{height:100%;display:flex;flex-direction:column;background:#141518;border:1px solid #23252A;border-radius:18px;padding:30px 40px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;color:#A9ACB2;font-size:calc(var(--fs)*.6);letter-spacing:.04em;text-transform:uppercase}
.rt{display:flex;align-items:center;gap:14px;text-transform:none;letter-spacing:0}.ctl{display:flex;gap:6px}.ctl button{background:#1E2024;color:#F4F4F1;border:1px solid #33363C;border-radius:8px;font-size:15px;min-width:42px;height:32px;cursor:pointer}.ctl button:hover{background:#2A2D33}

main{flex:1;overflow:auto;padding:.9em 0 .6em}
.pre{color:#C9CCD1;font-size:calc(var(--fs)*.78);line-height:1.45;margin:0 0 1em;padding:.6em .9em;border-left:3px solid #FEC204;background:#1A1B1F;border-radius:6px}
ul{margin:0;padding:0;list-style:none;font-size:var(--fs);line-height:1.55}li{margin:0 0 1.15em;padding-left:1.05em;position:relative}li+li{padding-top:1.15em;border-top:1px solid #23252A}li+li:before{top:1.15em}.acao{font-style:italic;color:#A9ACB2}li:before{content:'•';position:absolute;left:0;color:#F4F4F1}li b{font-weight:700;color:#FFFFFF}
.lab{font-size:calc(var(--fs)*.55);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:.9em 0 .45em}.gk .lab{color:#FEC204}.nx .lab{color:#A9ACB2;font-weight:500}
.gk p{margin:0 0 .9em;font-size:calc(var(--fs)*.82);line-height:1.45;color:#F4F4F1}.nx p{margin:0;font-size:calc(var(--fs)*.78);color:#E2E3E6}
.empty{font-size:var(--fs);color:#9A9DA3}.wait{color:#8A8D93}
</style></head><body><div class="card"><div class="top"><span id="act">Baya · Modo apresentador</span><div class="rt"><span id="cnt"></span><div class="ctl"><button id="dn" title="Diminuir fonte (−)">A−</button><button id="up" title="Aumentar fonte (+)">A+</button></div></div></div>
<h1 id="ti"><span class="wait">Aguardando a apresentação…</span></h1><hr><main id="bd"></main><hr><div class="gk" id="gk"></div><hr id="gkhr"><div class="nx"><div class="lab">Próxima tela</div><p id="nx"></p></div></div><script>
const NOTES={"capitulo": {"act": "Ato I · Transformação", "t": "Estamos construindo um novo capítulo", "b": ["Hoje eu quero compartilhar com vocês uma proposta que surgiu a partir do momento de transformação que estamos vivendo no Design System.", "A gente está repensando nossa estrutura e nossa forma de trabalhar, e eu achei que essa era uma ótima oportunidade para dar uma identidade a essa nova fase.", "Mas, antes de falar do que vem pela frente, vale olhar para o que já construímos."], "h": ""}, "trajetoria": {"act": "Ato I · Transformação", "t": "Construímos muito até aqui", "b": ["Até aqui, tivemos duas frentes: o DS N Marcas, voltado para Web, e o DS Apps, voltado para as experiências de aplicativo. Cada uma nasceu para atender necessidades diferentes.", "Nas duas frentes, acumulamos conhecimento, componentes, documentação e aprendizados. A ideia agora não é começar do zero, mas aproveitar essa maturidade.", "E, conforme o nosso ecossistema cresce, a forma de organizar tudo isso também precisa evoluir."], "h": ""}, "evoluir": {"act": "Ato I · Transformação", "t": "Novos desafios. Novas estruturas.", "b": ["O modelo federado vem justamente dessa necessidade de equilibrar o que podemos compartilhar com aquilo que precisa ser específico de cada marca.", "Queremos dar autonomia aos times, sem perder a governança que nos ajuda a evitar duplicações e inconsistências. Assim, conseguimos evoluir juntos, sem que cada frente precise resolver tudo isoladamente.", "Essa mudança também nos abre a oportunidade de aproximar os dois Design Systems que temos hoje."], "h": ""}, "estrutura": {"act": "Ato I · Transformação", "t": "Diferentes plataformas. Um ecossistema.", "b": ["A proposta é que Web e App façam parte de um único ecossistema, com uma governança comum e fundamentos compartilhados sempre que fizer sentido.", "Isso não significa que teremos necessariamente os mesmos componentes ou a mesma implementação nas duas plataformas. Cada uma continua tendo suas particularidades, assim como cada marca mantém sua identidade.", "E, se estamos fazendo uma mudança tão significativa na estrutura, por que não aproveitar para ir um pouco além?"], "h": ""}, "oportunidade": {"act": "Ato I · Transformação", "t": "Se mudamos como construímos, por que não mudar como nos apresentamos?", "b": ["Foi dessa pergunta que surgiu a ideia de criar uma identidade própria para o nosso Design System.", "Mais do que mudar o nome de uma biblioteca, queremos ter algo que represente essa nova estrutura e ajude as pessoas a reconhecerem o DS como um produto interno, com uma comunidade e um propósito.", "Uma identidade que faça sentido tanto para quem trabalha com Web quanto para quem trabalha com App."], "h": ""}, "novo-capitulo": {"act": "Ato I · Transformação", "t": "Uma nova estrutura. Uma nova identidade. Um novo capítulo.", "b": ["Então, quando comecei a pensar nessa nova identidade, não queria escolher um nome simplesmente porque ele era bonito ou soava bem.", "Queria encontrar algo que representasse a nossa forma de construir e que, ao mesmo tempo, tivesse uma conexão genuína com o nosso negócio, que é a moda.", "E foi justamente nessa busca que encontrei uma referência muito interessante na natureza."], "h": ""}, "inspiracao": {"act": "Ato II · Descoberta", "t": "A natureza já sabia construir sistemas.", "b": ["Esse é o Baya Weaver, uma espécie de pássaro-tecelão conhecida por construir ninhos suspensos utilizando fibras vegetais.", "O que me chamou a atenção não foi apenas a aparência do pássaro, mas a maneira como ele constrói: seleciona e entrelaça fibras para criar uma estrutura elaborada e funcional.", "E, quando comecei a olhar para esse processo, percebi que ele tinha muito mais a ver com o nosso trabalho do que parecia inicialmente."], "h": ""}, "pequenas-partes": {"act": "Ato II · Descoberta", "t": "Pequenas partes. Grandes construções.", "b": ["Na natureza, temos fibras que se conectam para formar um ninho. Na moda, temos fios que se entrelaçam para formar tecidos e texturas.", "No design, combinamos componentes para construir interfaces; na tecnologia, organizamos pequenas unidades reutilizáveis para construir sistemas maiores.", "São universos diferentes, mas todos compartilham esse princípio de construção. E foi dessa conexão que surgiu a proposta de nome."], "h": ""}, "revelacao": {"act": "Ato II · Descoberta", "t": "Revelação do Baya Design System", "b": ["A proposta é chamar esse novo ecossistema de Baya Design System.", "Baya é um nome curto, com personalidade e uma origem que conversa diretamente com o que fazemos. Ele representa o sistema como um todo, e não apenas uma biblioteca ou uma plataforma.", "E eu gosto especialmente dele porque conseguimos defender a escolha por três perspectivas que se complementam."], "h": ""}, "nome-sistema": {"act": "Ato II · Descoberta", "t": "Um nome que já é um sistema.", "b": ["Primeiro, o pássaro representa a inteligência de construir algo complexo a partir de elementos simples. Segundo, a tecelagem nos conecta diretamente à moda, que é a essência do nosso negócio.", "E, por último, o próprio processo de tecer representa a lógica de um Design System: elementos compartilhados que podem ser combinados de muitas maneiras.", "Assim como uma mesma trama pode dar origem a diferentes tecidos, uma base comum pode dar origem a experiências de marcas diferentes. Essa ideia foi o ponto de partida do nosso manifesto."], "h": ""}, "manifesto": {"act": "Ato III · Essência", "t": "Manifesto", "b": ["O manifesto procura traduzir justamente essa relação entre o que compartilhamos e aquilo que torna cada marca única.", "<span class=\"acao\">Deixar o manifesto aparecer e acompanhar seu ritmo.</span>", "A frase que eu queria destacar é: estruturamos o que nos conecta para potencializar o que nos diferencia. Para mim, ela resume muito bem a intenção do nosso modelo federado.", "E essa intenção também se reflete no posicionamento que queremos para o Baya."], "h": ""}, "posicionamento": {"act": "Ato III · Essência", "t": "Um Design System para muitas marcas.", "b": ["Queremos um Design System unificado e multiplataforma, que conecte Web e App respeitando as necessidades de cada um.", "Ao mesmo tempo, ele é multimarcas e federado: a base compartilhada não deve limitar a autonomia nem a identidade de cada marca.", "E, acima de tudo, queremos que seja evolutivo, porque o sistema precisa acompanhar as mudanças do negócio e de quem o utiliza. Esses atributos nos ajudam a definir também os princípios da marca."], "h": ""}, "pilares": {"act": "Ato III · Essência", "t": "Um fio condutor: a tecelagem.", "b": ["A tecelagem acaba sendo o fio condutor de todos esses princípios. Ela representa conexão e construção, porque cada elemento contribui para algo maior.", "Também representa diversidade e colaboração, porque podemos combinar diferentes elementos e conhecimentos dentro de uma estrutura comum. E essa estrutura pode continuar evoluindo.", "A partir dessa essência, pensei em três formas complementares de comunicar verbalmente o Baya."], "h": ""}, "sig-institucional": {"act": "Ato III · Essência", "t": "Entrelaçando design, moda e tecnologia.", "b": ["A primeira assinatura é “Entrelaçando design, moda e tecnologia”. Ela explica de maneira mais institucional quais são os universos que o Baya conecta.", "Faz bastante sentido para apresentações e comunicações em que queremos contextualizar o que é o Design System e sua relação com o negócio.", "Já a segunda assinatura olha um pouco mais para as pessoas que fazem parte desse ecossistema."], "h": ""}, "sig-comunidade": {"act": "Ato III · Essência", "t": "Conectados por natureza.", "b": ["“Conectados por natureza” tem uma intenção mais emocional. Ela faz referência à origem do nome, mas também fala sobre pertencimento e sobre as conexões entre quem constrói e utiliza o sistema.", "É uma assinatura que pode funcionar muito bem em eventos e na comunicação interna.", "E, pensando na diversidade do nosso ecossistema, temos uma terceira forma de expressar essa mesma essência."], "h": ""}, "sig-multimarcas": {"act": "Ato III · Essência", "t": "A trama que conecta nossas marcas.", "b": ["“A trama que conecta nossas marcas” traduz de forma mais direta o papel do DS dentro do negócio. É a base que conecta diferentes identidades, sem substituir nenhuma delas.", "Podemos usar essa assinatura na documentação e nas ferramentas. Não precisamos escolher entre as três: elas funcionam como um sistema verbal flexível.", "E, assim como podemos expressar a mesma essência de diferentes maneiras verbalmente, também podemos fazer isso visualmente."], "h": ""}, "pc-inspiracao": {"act": "Ato IV · Ponto cruz", "t": "Inspiração: Do ponto ao pixel.", "b": ["A primeira proposta traz a tecnologia como território predominante, mas mantém uma conexão muito forte com a moda.", "A ideia foi aproximar o bordado, a imagem digital e o pássaro-tecelão, procurando uma lógica que esses três elementos pudessem compartilhar.", "E o elemento que acabou conectando essas referências foi justamente o ponto."], "h": ""}, "pc-territorio": {"act": "Ato IV · Ponto cruz", "t": "Tecnologia em ponto", "b": ["O ponto é uma unidade muito simples quando olhamos para ele isoladamente. Mas, quando organizamos vários pontos dentro de uma estrutura, conseguimos construir imagens e padrões bastante complexos.", "Essa lógica me interessa porque também está presente no Design System: pequenas unidades organizadas por regras que permitem construir algo maior.", "Para entender como chegamos a essa linguagem visual, vamos começar pela referência artesanal."], "h": ""}, "pc-conceito-1": {"act": "Ato IV · Ponto cruz", "t": "Tudo começou no ponto cruz.", "b": ["No ponto cruz, temos pontos em formato de X organizados sobre uma grade. Cada ponto ocupa uma posição e contribui com uma parte da imagem.", "É uma referência diretamente ligada ao universo têxtil, mas também possui essa característica de precisão e organização.", "E, quando saímos do tecido e olhamos para uma tela digital, encontramos um princípio muito parecido."], "h": ""}, "pc-conceito-2": {"act": "Ato IV · Ponto cruz", "t": "O mesmo princípio do pixel.", "b": ["Uma imagem digital também é construída a partir de pequenas unidades, os pixels, que carregam informações de cor e posição.", "O bordado e a imagem digital são processos diferentes, mas essa lógica de organização nos permite fazer uma ponte muito natural entre os dois.", "Existe ainda uma técnica computacional que tornou essa conexão especialmente interessante para a proposta."], "h": ""}, "pc-conceito-3": {"act": "Ato IV · Ponto cruz", "t": "Ponto a ponto, uma imagem.", "b": ["Essa técnica é o dithering de Bayer, que utiliza uma matriz para distribuir pontos de maneira ordenada e simular tonalidades com uma quantidade limitada de cores.", "Além da relação visual com o bordado, existe uma coincidência interessante entre o nome Bayer e o nome Baya. Não foi daí que surgiu o nome da marca, mas é uma camada conceitual que enriquece a proposta.", "A partir dessa referência, conseguimos desenvolver a linguagem gráfica que vocês estão vendo."], "h": ""}, "pc-funciona": {"act": "Ato IV · Ponto cruz", "t": "Do bordado à tela.", "b": ["A ideia foi traduzir a lógica do ponto cruz para uma textura digital, com diferentes densidades de pontos e pequenos destaques amarelos sobre a base cinza.", "O pattern consegue assumir diferentes intensidades, dependendo da aplicação, sem perder a relação com a referência original.", "E, para conectar essa linguagem novamente à natureza, trouxe também a figura do próprio pássaro."], "h": ""}, "pc-marca": {"act": "Ato IV · Ponto cruz", "t": "O Baya vira ícone.", "b": ["Nessa proposta, o pássaro se torna um símbolo que pode funcionar independentemente do lettering Baya.", "Temos uma versão flat, mais adequada para aplicações pequenas, e uma versão bordada, que permite explorar mais detalhes em peças maiores. Assim, não precisamos utilizar a versão mais complexa em todos os contextos.", "Essa diferença de escala e de expressão também aparece na personalidade da identidade."], "h": ""}, "pc-sensacao": {"act": "Ato IV · Ponto cruz", "t": "Precisa. Digital. Viva.", "b": ["A proposta é precisa pela organização dos pontos, digital pela referência aos pixels e viva pela maneira como esses elementos se movimentam.", "As animações de revelação e fluxo seguem a própria lógica de construção do pattern. O movimento não é um efeito separado da identidade, ele nasce dela.", "Mas precisamos ver como essa expressão funciona quando o conteúdo, e não a marca, é o protagonista."], "h": ""}, "pc-moldura": {"act": "Ato IV · Ponto cruz", "t": "A identidade na moldura.", "b": ["Na documentação, o Baya funciona como a identidade institucional da ferramenta. Podemos usar a textura em áreas de navegação, cabeçalhos e outros espaços de comunicação.", "Quando estamos mostrando componentes ou tokens de uma marca, é aquela marca que precisa continuar sendo protagonista. A identidade do Baya funciona como uma moldura, sem interferir no conteúdo.", "Esse mesmo cuidado vale para as outras aplicações do dia a dia."], "h": ""}, "pc-dia": {"act": "Ato IV · Ponto cruz", "t": "No dia a dia do time.", "b": ["Aqui conseguimos ver como a proposta se adapta a capas de arquivos, banners, cards e apresentações. A textura pode aparecer com mais ou menos intensidade, conforme a função de cada peça.", "Isso é importante porque queremos uma identidade reconhecível sem precisar repetir exatamente a mesma composição em todos os materiais.", "E existe ainda um diferencial específico dessa proposta: o uso do pássaro como elemento independente."], "h": ""}, "pc-passaro": {"act": "Ato IV · Ponto cruz", "t": "O pássaro sozinho também é marca.", "b": ["O símbolo pode aparecer sozinho em um avatar, favicon, ícone ou em elementos mais expressivos de comunicação. A versão adequada depende da escala e do contexto.", "Esse é um dos diferenciais do primeiro território: além do lettering e do pattern, temos um símbolo figurativo que pode ajudar a construir reconhecimento.", "Se nessa proposta conectamos moda e tecnologia pelo ponto, na segunda vamos partir diretamente da estrutura do tecido."], "h": ""}, "lc-inspiracao": {"act": "Ato IV · Laçada", "t": "Inspiração: Do fio à trama.", "b": ["A segunda proposta se aproxima ainda mais do universo da moda, mas de uma maneira menos figurativa e mais editorial.", "A referência aqui são as laçadas e as estruturas têxteis: observar como um fio se conecta ao próximo e como a repetição dessas conexões cria uma superfície.", "Em vez de representar o pássaro, vamos representar a própria lógica da tecelagem."], "h": ""}, "lc-territorio": {"act": "Ato IV · Laçada", "t": "Conexões em movimento.", "b": ["O que me interessou nessa ideia é que a estrutura não precisa ter uma única configuração. Os laços podem se conectar e se reorganizar, criando diferentes caminhos.", "Isso conversa com o nosso cenário multimarcas: queremos uma base que permita diferentes expressões, e não uma base que determine um único resultado.", "Para construir essa linguagem, partimos de um gesto bem simples."], "h": ""}, "lc-conceito-1": {"act": "Ato IV · Laçada", "t": "Tudo começou no laço.", "b": ["O ponto de partida é o gesto de dobrar e entrelaçar o fio, presente em estruturas de malha e laçadas.", "A partir dele, buscamos uma forma gráfica que mantivesse a sensação de continuidade e conexão, sem precisar reproduzir literalmente um tecido.", "Quando organizamos essa forma dentro de uma célula, ela passa a funcionar como um módulo reutilizável."], "h": ""}, "lc-conceito-2": {"act": "Ato IV · Laçada", "t": "Um módulo, infinitas tramas.", "b": ["Aqui temos a unidade gráfica que sustenta a proposta. Os arcos se organizam dentro da célula e podem ser rotacionados para se conectar de diferentes maneiras.", "É uma analogia muito próxima dos nossos componentes: existe uma estrutura e existem regras de utilização, mas as possibilidades de composição são variadas.", "E essas combinações não precisam ser estáticas."], "h": ""}, "lc-conceito-3": {"act": "Ato IV · Laçada", "t": "Conexões em movimento.", "b": ["Ao rotacionar as células em onda, novos caminhos aparecem utilizando exatamente as mesmas unidades. A animação evidencia esse comportamento do sistema gráfico.", "O resultado muda sem que a linguagem perca sua coerência. Isso permite explorar repetição sem criar uma identidade monótona.", "E é justamente essa característica que faz a proposta conversar tão bem com o Design System."], "h": ""}, "lc-funciona": {"act": "Ato IV · Laçada", "t": "Do fio ao sistema.", "b": ["O próprio pattern funciona como um pequeno sistema: temos uma unidade, regras de combinação e possibilidades de variação.", "Essa é uma representação da liberdade criativa que queremos preservar nas marcas. Compartilhar fundamentos não significa produzir sempre a mesma coisa.", "Por isso, nessa proposta, a própria trama assume o papel de assinatura visual."], "h": ""}, "lc-marca": {"act": "Ato IV · Laçada", "t": "A trama assina a marca.", "b": ["Aqui não temos o símbolo figurativo do pássaro. O reconhecimento vem da combinação entre o lettering e a linguagem modular.", "A composição principal utiliza azul pastel com amarelo, e temos também uma variação em azul e vinho. Essas combinações mostram como podemos variar a expressão sem perder a estrutura.", "Essa escolha resulta em uma personalidade visual diferente da proposta anterior."], "h": ""}, "lc-sensacao": {"act": "Ato IV · Laçada", "t": "Fluida. Leve. Editorial.", "b": ["A Laçada é fluida pela continuidade das formas, leve pela combinação cromática e editorial pela proximidade com o universo da moda.", "Embora não tenha uma aparência explicitamente tecnológica, a tecnologia está presente na lógica de construção e nas regras de movimento.", "Vamos observar como essa personalidade se comporta em um contexto mais funcional, como a documentação."], "h": ""}, "lc-moldura": {"act": "Ato IV · Laçada", "t": "A identidade na moldura.", "b": ["A trama pode aparecer nos cabeçalhos e áreas institucionais da documentação, com escala e intensidade ajustadas à necessidade de cada tela.", "Assim como na proposta anterior, o objetivo é criar reconhecimento para o Baya sem interferir nas identidades das marcas ou na leitura dos componentes.", "E a modularidade dessa linguagem nos oferece bastante liberdade nas demais aplicações."], "h": ""}, "lc-dia": {"act": "Ato IV · Laçada", "t": "No dia a dia do time.", "b": ["Nas capas, cards, banners e apresentações, podemos reorganizar a mesma unidade e criar composições adequadas a diferentes formatos.", "O diferencial da Laçada está justamente nessa liberdade: o pattern pode evoluir, variar e continuar reconhecível porque possui uma estrutura consistente.", "Já exploramos o ponto e o fio. Na terceira proposta, voltamos à origem do nome e observamos mais de perto o ninho do Baya."], "h": ""}, "nn-inspiracao": {"act": "Ato IV · Ninho", "t": "Inspiração: Da fibra à estrutura.", "b": ["A terceira proposta dá mais protagonismo à natureza. Em vez de representar o pássaro, a inspiração está na maneira como ele constrói o ninho.", "Observamos as fibras, suas diferentes direções, as sobreposições e as densidades. A intenção não é desenhar literalmente um ninho, mas traduzir a lógica dessa construção.", "E o mais interessante é perceber o que acontece quando essas pequenas partes começam a se conectar."], "h": ""}, "nn-territorio": {"act": "Ato IV · Ninho", "t": "Construção coletiva.", "b": ["Uma fibra isolada tem possibilidades limitadas, mas, entrelaçada a outras, passa a fazer parte de uma estrutura muito mais elaborada.", "Essa é uma metáfora para a nossa construção coletiva: diferentes pessoas e times contribuem para fortalecer uma estrutura compartilhada. A colaboração aqui representa o nosso DS, não necessariamente a forma como a ave constrói cada ninho.", "Podemos expressar essa ideia mostrando a própria construção em movimento."], "h": ""}, "nn-movimento": {"act": "Ato IV · Ninho", "t": "Marca em movimento.", "b": ["Nessa animação, as fibras aparecem progressivamente e começam a formar uma composição. O interessante é que conseguimos acompanhar o processo, não apenas o resultado final.", "Isso conversa com a ideia de um Design System que está sempre evoluindo, recebendo novas contribuições e se adaptando.", "Para desenvolver essa linguagem, começamos pelo menor elemento da estrutura."], "h": ""}, "nn-conceito-1": {"act": "Ato IV · Ninho", "t": "Tudo começou com uma fibra.", "b": ["A fotografia do ninho nos permite observar os detalhes que normalmente passam despercebidos: a irregularidade das fibras, suas direções e a maneira como se sobrepõem.", "A partir dessa observação, criamos uma textura que preserva essa sensação orgânica mesmo sendo construída digitalmente.", "Conforme essas fibras se acumulam, começamos a perceber a forma ganhando estrutura."], "h": ""}, "nn-conceito-2": {"act": "Ato IV · Ninho", "t": "Camada sobre camada.", "b": ["A sobreposição das fibras cria diferentes densidades e movimentos. Algumas áreas podem ser mais preenchidas, enquanto outras deixam os elementos mais soltos.", "Essa combinação permite equilibrar a organização da composição com a sensação natural da textura.", "E essa maneira de construir camada por camada também é uma boa metáfora para a evolução do nosso Design System."], "h": ""}, "nn-conceito-3": {"act": "Ato IV · Ninho", "t": "Da fibra à estrutura.", "b": ["Cada contribuição pode acrescentar algo ao sistema: um componente, um fundamento, uma documentação ou um aprendizado.", "Com governança e uma base compartilhada, conseguimos incorporar essas contribuições de maneira incremental, sem precisar reconstruir tudo a cada mudança.", "E, visualmente, essa lógica nos dá liberdade para explorar muito mais do que o formato original do ninho."], "h": ""}, "nn-formas": {"act": "Ato IV · Ninho", "t": "Fibras que montam qualquer forma.", "b": ["A mesma textura pode se transformar em uma fita, uma diagonal, uma órbita, uma espiral, um bloco tecido ou até preencher a letra B. Também podemos utilizar fibras soltas como apoio.", "Cada forma tem uma função: separar conteúdos, criar movimento, preencher uma área ou servir como elemento de reconhecimento.", "Mais do que uma estampa fixa, temos uma linguagem que se adapta. E essa capacidade de adaptação nos leva novamente ao conceito de colaboração."], "h": ""}, "nn-funciona": {"act": "Ato IV · Ninho", "t": "Muitas mãos.", "b": ["O Baya não é construído apenas pelo time que mantém o Design System. Ele depende da participação e do conhecimento de Design, Tecnologia e dos times das marcas.", "A governança ajuda a organizar essas contribuições para que elas fortaleçam o ecossistema, em vez de criar estruturas desconectadas.", "É essa ideia de diferentes partes formando algo maior que a linguagem de fibras procura representar."], "h": ""}, "nn-marca": {"act": "Ato IV · Ninho", "t": "A fibra assina a marca.", "b": ["Nessa proposta, assim como na Laçada, não temos um pássaro como símbolo principal. As fibras passam a funcionar como a assinatura gráfica da marca.", "A combinação de verdes, musgo e lilás, com pequenos destaques amarelos, cria uma linguagem de inspiração natural que pode assumir diferentes formas e densidades.", "Essa escolha também determina a personalidade visual e o comportamento da identidade."], "h": ""}, "nn-sensacao": {"act": "Ato IV · Ninho", "t": "Orgânica. Artesanal. Humana.", "b": ["A proposta é orgânica pelas formas e direções das fibras, artesanal pela valorização do processo de construção e humana pela relação com a colaboração.", "A animação dos traços reforça essa personalidade ao revelar como a composição é formada. Existe um contraste interessante entre essa expressão orgânica e o ambiente tecnológico em que trabalhamos.", "Mas ela também precisa funcionar de maneira discreta quando necessário."], "h": ""}, "nn-moldura": {"act": "Ato IV · Ninho", "t": "A identidade na moldura.", "b": ["Na documentação, as fibras podem ocupar cantos, bordas, cabeçalhos e divisores, sem precisar dominar a interface.", "Conseguimos ajustar sua densidade para preservar a legibilidade e manter os componentes das marcas como protagonistas. O Baya continua funcionando como uma moldura institucional.", "Essa flexibilidade também aparece quando levamos a identidade para outros materiais."], "h": ""}, "nn-dia": {"act": "Ato IV · Ninho", "t": "No dia a dia do time.", "b": ["Nas aplicações do dia a dia, conseguimos usar as fibras tanto em pequenos detalhes quanto em grandes composições, variando direção, escala e densidade.", "O diferencial do Ninho é essa flexibilidade orgânica, que traduz visualmente a construção coletiva sem depender de uma forma única.", "Chegamos, então, a três maneiras diferentes de representar a mesma essência. E faz sentido que o próximo passo também seja construído em conjunto."], "h": ""}, "votacao": {"act": "Ato V · Construção coletiva", "t": "Agora, a trama é nossa.", "b": ["As três propostas partem do mesmo nome, manifesto e posicionamento. O que muda é a maneira de expressar visualmente essa essência.", "No Ponto Cruz, temos o encontro entre artesanal e digital; na Laçada, a modularidade e a liberdade criativa da moda; no Ninho, a natureza e a construção coletiva.", "Na hora de votar, queria que vocês pensassem além da cor ou do logo favorito: qual identidade representa melhor o DS que queremos construir e consegue acompanhar sua evolução?", "<span class=\"acao\">Convidar o time a participar da votação.</span>"], "h": ""}, "resultados": {"act": "Ato V · Construção coletiva", "t": "Resultados / O próximo capítulo.", "b": ["Vamos acompanhar o resultado e aproveitar para ouvir um pouco das percepções de vocês. O que fez vocês se identificarem mais com uma proposta do que com as outras?", "A ideia é que essa escolha nos ajude a definir o território que vamos continuar refinando. Não significa que toda a construção da identidade termina aqui.", "Independentemente da expressão escolhida, o propósito que trouxe a gente até esse momento continua o mesmo."], "h": ""}, "encerramento": {"act": "Ato V · Construção coletiva", "t": "Encerramento", "b": ["Quero voltar à ideia que abriu essa apresentação: começamos com duas trajetórias e estamos construindo um ecossistema que conecta Web, App e diferentes marcas.", "O Baya é uma forma de representar essa evolução, preservando a individualidade das marcas e fortalecendo aquilo que podemos compartilhar.", "Obrigada por fazerem parte dessa escolha. A ideia é que essa identidade também seja construída da maneira como queremos construir o nosso Design System: juntos."], "h": ""}};
const w=window;
function render(w,s){const d=w.document;if(!d.getElementById('ti'))return;const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 d.getElementById('act').textContent=s.act||'Baya · Modo apresentador';
 d.getElementById('cnt').textContent=s.num?(+s.num)+' / '+s.total:'';
 d.getElementById('ti').innerHTML=s.b?s.t:esc(s.t||'Tela sem título');
 let h='';if(s.pre)h+='<p class="pre"><b>Transição do ato:</b> '+s.pre+'</p>';
 h+=s.b?'<ul>'+s.b.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="empty">Sem roteiro para esta tela.</p>';
 d.getElementById('bd').innerHTML=h;d.getElementById('bd').scrollTop=0;
 const gk=d.getElementById('gk');gk.innerHTML=s.h?'<div class="lab">Gancho de transição</div><p>'+s.h+'</p>':'';gk.style.display=s.h?'':'none';d.getElementById('gkhr').style.display=s.h?'':'none';
 const nt=s.next?String(s.next.t):'Fim do roteiro';d.getElementById('nx').innerHTML=s.next?nt:esc(nt);
 const tmp=d.createElement('div');tmp.innerHTML=s.t||'';d.title=(s.num?s.num+' · ':'')+(tmp.textContent||'Baya')+' · Apresentador'}

let fs=28;try{fs=+localStorage.getItem('bayaPresFs2')||28}catch(e){}
const d=document;const ap=()=>{d.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('bayaPresFs2',fs)}catch(e){}};ap();
d.getElementById('up').onclick=()=>{fs=Math.min(48,fs+2);ap()};d.getElementById('dn').onclick=()=>{fs=Math.max(16,fs-2);ap()};
d.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){fs=Math.min(48,fs+2);ap()}else if(e.key==='-'||e.key==='_'){fs=Math.max(16,fs-2);ap()}});
function show(st){if(!st)return;const n=NOTES[st.key];const s={act:n?n.act:st.act,num:st.num,total:st.total,t:n?n.t:st.t,b:n?n.b:null,h:n?n.h:'',pre:n?n.pre:''};
 if(st.next){const nn=NOTES[st.next.key];s.next={num:st.next.num,t:nn?nn.t:String(st.next.t||'').replace(/[&<>]/g,'')}}render(w,s)}
let ch=null;try{ch=new BroadcastChannel('baya-apresentador');ch.onmessage=e=>{if(e.data&&e.data.key!==undefined)show(e.data)};ch.postMessage('hello')}catch(e){}
addEventListener('storage',e=>{if(e.key==='baya-ap-state'&&e.newValue)try{show(JSON.parse(e.newValue))}catch(x){}});
try{localStorage.setItem('baya-ap-hello',String(Date.now()));const v=localStorage.getItem('baya-ap-state');if(v)show(JSON.parse(v))}catch(e){}
</script></body></html>
