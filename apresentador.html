const NOTES={"capitulo": {"act": "Ato I · Transformação", "t": "Estamos construindo um novo capítulo", "b": ["<b>Transformação:</b> arquitetura, governança e forma de trabalhar.", "Aproveitar a mudança para dar identidade à nova fase do DS.", "Apresentar a proposta e envolver o time na decisão."], "h": "Antes de falar do futuro, reconhecer tudo que construímos até aqui."}, "trajetoria": {"act": "Ato I · Transformação", "t": "Construímos muito até aqui", "b": ["<b>DS Apps e DS N Marcas:</b> necessidades e trajetórias diferentes.", "Componentes, tokens, documentação, processos e maturidade conquistada.", "Aproveitar o conhecimento existente, não começar do zero."], "h": "O crescimento do ecossistema pede uma evolução na forma de organizar nossos sistemas."}, "evoluir": {"act": "Ato I · Transformação", "t": "Novos desafios. Novas estruturas.", "b": ["Mais marcas e necessidades específicas → maior complexidade.", "<b>Federado:</b> compartilhar o que faz sentido, preservar autonomia.", "Governança para evitar fragmentação, duplicação e inconsistência.", "Evolução conectada, em vez de isolada."], "h": "Essa estrutura também permite repensar a separação entre Web e App."}, "estrutura": {"act": "Ato I · Transformação", "t": "Diferentes plataformas. Um ecossistema.", "b": ["<b>Unificar DS Apps e DS N Marcas.</b>", "Fundamentos, componentes base compartilháveis, documentação e governança.", "Respeitar particularidades técnicas e de experiência de cada plataforma.", "<b>Unificar não é uniformizar.</b>"], "h": "Se estamos transformando nossa estrutura, por que parar por aí?"}, "oportunidade": {"act": "Ato I · Transformação", "t": "Se mudamos como construímos, por que não mudar como nos apresentamos?", "b": ["Grande mudança estrutural → oportunidade de uma nova entrega.", "Identidade que represente Web e App.", "Reconhecimento do DS como produto interno e senso de pertencimento.", "Personalidade própria, sem competir com as marcas."], "h": "Mais do que reorganizar sistemas, estamos inaugurando uma nova fase."}, "novo-capitulo": {"act": "Ato I · Transformação", "t": "Uma nova estrutura. Uma nova identidade. Um novo capítulo.", "b": ["Identidade como consequência da transformação.", "Representar colaboração, diversidade e construção.", "Buscar uma referência conectada ao nosso trabalho e à essência do negócio: <b>moda</b>."], "h": "Encontramos essa inspiração na natureza."}, "inspiracao": {"act": "Ato II · Descoberta", "t": "A natureza já sabia construir sistemas.", "b": ["<b>Baya Weaver — Ploceus philippinus</b>, pássaro-tecelão.", "Ninhos suspensos feitos de fibras vegetais entrelaçadas.", "Mais do que aparência: técnica, organização e inteligência construtiva.", "Pequenos elementos → estrutura complexa, funcional e resistente."], "h": "Esse princípio de construção aparece em outros universos do nosso trabalho."}, "pequenas-partes": {"act": "Ato II · Descoberta", "t": "Pequenas partes. Grandes construções.", "b": ["<b>Natureza:</b> fibras → ninhos.", "<b>Moda:</b> fios → tecidos, texturas e expressões.", "<b>Design:</b> componentes → interfaces e experiências.", "<b>Tecnologia:</b> unidades reutilizáveis → sistemas complexos.", "O valor está também na relação entre os elementos."], "h": "Uma inspiração que representa nosso trabalho e nosso negócio."}, "revelacao": {"act": "Ato II · Descoberta", "t": "Revelação do Baya Design System", "b": ["<b>Baya:</b> nome inspirado diretamente no pássaro-tecelão.", "Curto, sonoro, memorável, com significado; não é uma sigla.", "Identidade do ecossistema inteiro: Web, App, marcas, pessoas, ferramentas e documentação.", "Potencial de expansão além das bibliotecas Figma."], "h": "O nome pode ser defendido por três perspectivas complementares."}, "nome-sistema": {"act": "Ato II · Descoberta", "t": "Um nome que já é um sistema.", "b": ["<b>Pássaro:</b> inteligência construtiva e relação entre forma e função.", "<b>Tecelagem:</b> conexão direta com o negócio de moda do Grupo Soma.", "<b>Sistema:</b> tokens, componentes, templates, modularidade e reutilização.", "Uma mesma trama pode gerar diferentes tecidos; uma base comum, diferentes experiências.", "Estrutura compartilhada sem eliminar individualidade."], "h": "Essa descoberta se traduz no manifesto."}, "manifesto": {"act": "Ato III · Essência", "t": "Manifesto", "b": ["Deixar a revelação respirar; retomar a metáfora do fio.", "Natureza, moda, design e tecnologia conectados.", "<b>Organizar sem engessar. Unificar sem uniformizar.</b>", "Evoluir preservando a essência de cada marca.", "Fechamento: <b>Estruturamos o que nos conecta para potencializar o que nos diferencia.</b>", "Síntese da marca e do modelo federado."], "h": "Como essa essência se traduz no DS que queremos construir?"}, "posicionamento": {"act": "Ato III · Essência", "t": "Um Design System para muitas marcas.", "b": ["<b>Unificado:</b> ecossistema e governança comuns.", "<b>Multiplataforma:</b> Web e App, com suas especificidades.", "<b>Multimarcas:</b> diferentes identidades sobre base compartilhada.", "<b>Federado:</b> autonomia com responsabilidade e governança.", "<b>Evolutivo:</b> acompanhar necessidades do negócio e dos times."], "h": "Alguns princípios sustentam esse posicionamento."}, "pilares": {"act": "Ato III · Essência", "t": "Um fio condutor: a tecelagem.", "b": ["<b>Conexão:</b> plataformas, marcas, pessoas e conhecimento.", "<b>Construção:</b> cada elemento contribui para o todo.", "<b>Diversidade:</b> base comum, experiências diferentes.", "<b>Colaboração:</b> evolução pelas contribuições dos times.", "<b>Evolução:</b> estrutura viva, adaptável.", "Tecelagem como metáfora da forma de trabalhar, não apenas referência estética."], "h": "Essa essência também pode ser expressa verbalmente de diferentes maneiras."}, "sig-institucional": {"act": "Ato III · Essência", "t": "Entrelaçando design, moda e tecnologia.", "b": ["<b>Posicionamento institucional.</b>", "Design: criação de experiências; moda: essência do negócio; tecnologia: estrutura e ": {"act": "Ato IV · Ponto cruz", "t": "O mesmo princípio do pixel.", "b": ["Pixel como unidade de uma imagem digital.", "Grade, posição e informação de cor.", "Bordado e imagem digital: meios diferentes, lógica semelhante."], "h": "Uma técnica computacional aproxima ainda mais esses universos."}, "pc-conceito-3": {"act": "Ato IV · Ponto cruz", "t": "Ponto a ponto, uma imagem.", "b": ["<b>Dithering de Bayer:</b> matriz ordenada para distribuir pontos.", "Simular tonalidades com quantidade limitada de cores; densidade e distribuição criam gradações.", "Proximidade sonora entre Baya e Bayer: camada criativa adicional, não origem do nome.", "Regras simples → resultados complexos."], "h": "Transformar o bordado em linguagem gráfica digital."}, "pc-funciona": {"act": "Ato IV · Ponto cruz", "t": "Do bordado à tela.", "b": ["Pattern com organização e repetição dos pontos.", "Cinza neutro, amarelo como destaque, variações de densidade.", "Pássaro traz a referência natural para essa linguagem.", "Moda, tecnologia e natureza na mesma composição."], "h": "O pássaro também assume uma função de reconhecimento."}, "pc-marca": {"act": "Ato IV · Ponto cruz", "t": "O Baya vira ícone.", "b": ["Simplificação gráfica do pássaro; amarelo, preto e marrom.", "Símbolo independente do lettering.", "<b>Flat:</b> legibilidade e redução. <b>Bordado:</b> expressão e riqueza visual em peças grandes."], "h": "Essa lógica determina a personalidade e o movimento da identidade."}, "pc-sensacao": {"act": "Ato IV · Ponto cruz", "t": "Precisa. Digital. Viva.", "b": ["<b>Precisa:</b> grade e organização.", "<b>Digital:</b> pixels e dithering.", "<b>Viva:</b> revelação e fluxo dos pontos.", "Movimento nasce das regras do pattern, não apenas de um efeito decorativo."], "h": "Como essa expressão funciona quando a informação é protagonista?"}, "pc-moldura": {"act": "Ato IV · Ponto cruz", "t": "A identidade na moldura.", "b": ["Identidade institucional na documentação, navegação e cabeçalhos.", "Textura como suporte, sem interferir nos exemplos.", "Tokens, componentes e identidades das marcas preservados.", "<b>Baya como moldura; marcas como protagonistas.</b>"], "h": "Levar a mesma lógica aos demais pontos de contato."}, "pc-dia": {"act": "Ato IV · Ponto cruz", "t": "No dia a dia do time.", "b": ["Capas Figma, banners, cards e apresentações.", "Adaptar intensidade, escala e ocupação da textura.", "Consistência sem repetir a mesma composição."], "h": "Um diferencial desta proposta é o símbolo independente."}, "pc-passaro": {"act": "Ato IV · Ponto cruz", "t": "O pássaro sozinho também é marca.", "b": ["Avatar, favicon, ícones, stickers e versões monocromáticas.", "Diferentes níveis de detalhe conforme a escala.", "Potencial de reconhecimento e personalidade.", "<b>Síntese:</b> ponto → grade → imagem; encontro artesanal e computacional."], "h": "Se a primeira aproxima moda e tecnologia pelo ponto, a segunda parte da estrutura do tecido."}, "lc-inspiracao": {"act": "Ato IV · Laçada", "t": "Inspiração: Do fio à trama.", "b": ["<b>Moda:</b> laçadas, estruturas de malha e padronagens têxteis.", "Uma unidade se conecta à próxima; repetição constrói superfícies.", "Abordagem abstrata e editorial."], "h": "Em vez de representar o pássaro, representar a lógica da tecelagem."}, "lc-territorio": {"act": "Ato IV · Laçada", "t": "Conexões em movimento.", "b": ["Laços se encontram, giram e se reorganizam.", "Diferentes caminhos a partir de uma estrutura comum.", "Relação com a diversidade das marcas: fundamentos permanecem, expressão muda."], "h": "Tudo parte de um gesto simples."}, "lc-conceito-1": {"act": "Ato IV · Laçada", "t": "Tudo começou no laço.", "b": ["Dobrar e entrelaçar um fio.", "Curvas, continuidade e conexão; inspiração na malharia.", "Traduzir um gesto físico em unidade gráfica abstrata."], "h": "Organizar esse gesto dentro de uma célula transforma-o em módulo."}, "lc-conceito-2": {"act": "Ato IV · Laçada", "t": "Um módulo, infinitas tramas.", "b": ["Arcos dentro de uma célula; regras de encaixe.", "Rotação de 90 graus e repetição geram diferentes caminhos.", "Analogia com componentes reutilizáveis.", "Módulo como base, trama como combinação."], "h": "Essas combinações não precisam ser estáticas."}, "lc-conceito-3": {"act": "Ato IV · Laçada", "t": "Conexões em movimento.", "b": ["Rotação das células em ondas.", "Novas composições sem perder a coerência.", "Repetição sem monotonia; movimento orientado por regras."], "h": "Essa característica tem tudo a ver com um Design System."}, "lc-funciona": {"act": "Ato IV · Laçada", "t": "Do fio ao sistema.", "b": ["Unidade, regras, composição e variação.", "O pattern funciona como um pequeno sistema de design.", "Liberdade criativa dentro de fundamentos comuns.", "Metáfora da autonomia das marcas no federado."], "h": "A própria trama passa a ser a assinatura visual."}, "lc-marca": {"act": "Ato IV · Laçada", "t": "A trama assina a marca.", "b": ["Lettering sem símbolo figurativo.", "Pattern como ativo de reconhecimento.", "Azul pastel e amarelo; variação azul e vinho.", "Aplicação da linguagem à letra B.", "Proximidade com identidades contemporâneas de moda."], "h": "Essa escolha cria uma personalidade diferente da primeira proposta."}, "lc-sensacao": {"act": "Ato IV · Laçada", "t": "Fluida. Leve. Editorial.", "b": ["<b>Fluida:</b> curvas e continuidade.", "<b>Leve:</b> cores suaves e equilíbrio.", "<b>Editorial:</b> tecidos, moda e estampas.", "Tecnologia presente nas regras de construção, sem aparência tecnológica óbvia."], "h": "Observar como essa personalidade se comporta na documentação."}, "lc-moldura": {"act": "Ato IV · Laçada", "t": "A identidade na moldura.", "b": ["Pattern nas áreas institucionais.", "Controlar escala, densidade e ocupação.", "Reconhecimento sem competir com a informação.", "Tokens e componentes das marcas independentes."], "h": "A modularidade também permite adaptar a comunicação do dia a dia."}, "lc-dia": {"act": "Ato IV · Laçada", "t": "No dia a dia do time.",  {"act": "Ato IV · Ninho", "t": "Da fibra à estrutura.", "b": ["Cada contribuição acrescenta algo: tokens, componentes, documentação e conhecimento.", "Times sobre uma base compartilhada; autonomia e governança.", "Evolução incremental, sem reconstruir tudo a cada mudança."], "h": "A lógica não precisa ficar limitada ao formato do ninho."}, "nn-formas": {"act": "Ato IV · Ninho", "t": "Fibras que montam qualquer forma.", "b": ["<b>Fita:</b> divisores e transições; <b>diagonal:</b> direção e movimento.", "<b>Espiral:</b> construção, evolução e loading; <b>órbita:</b> continuidade.", "<b>Bloco tecido:</b> cards e superfícies; <b>letra B:</b> reconhecimento.", "<b>Fibras soltas:</b> texturas de apoio.", "Linguagem flexível, não estampa fixa."], "h": "Diferentes formas a partir das mesmas fibras retomam a essência colaborativa."}, "nn-funciona": {"act": "Ato IV · Ninho", "t": "Muitas mãos.", "b": ["Design, Tecnologia e times das marcas: perspectivas e conhecimentos diferentes.", "Contribuições individuais fortalecem a estrutura.", "Governança organiza e sustenta a evolução.", "DS pertence ao ecossistema, não apenas a quem o mantém."], "h": "Essa lógica passa a identificar visualmente a marca."}, "nn-marca": {"act": "Ato IV · Ninho", "t": "A fibra assina a marca.", "b": ["Lettering sem pássaro figurativo.", "Fibras como assinatura gráfica; verde, musgo e lilás, destaques amarelos.", "Diferentes formas e densidades, mesma essência.", "Expressão orgânica, tátil e refinada."], "h": "Essa personalidade aparece especialmente no movimento."}, "nn-sensacao": {"act": "Ato IV · Ninho", "t": "Orgânica. Artesanal. Humana.", "b": ["<b>Orgânica:</b> direções e formas naturais.", "<b>Artesanal:</b> processo de construção.", "<b>Humana:</b> colaboração e diversidade.", "Traços desenhados progressivamente; contraste entre textura orgânica e ambiente tecnológico."], "h": "Apesar de expressiva, a linguagem pode assumir uma função discreta."}, "nn-moldura": {"act": "Ato IV · Ninho", "t": "A identidade na moldura.", "b": ["Fibras em bordas, cantos, cabeçalhos e divisores.", "Controlar densidade e intensidade para preservar legibilidade.", "Identidade institucional como suporte; marcas como protagonistas."], "h": "A flexibilidade das formas amplia o repertório de aplicações."}, "nn-dia": {"act": "Ato IV · Ninho", "t": "No dia a dia do time.", "b": ["Capas, banners, cards, apresentações e ferramentas.", "Variação de escala, direção e densidade; detalhes sutis ou grandes composições.", "<b>Síntese:</b> fibra → entrelaçamento → estrutura; natureza, colaboração e evolução."], "h": "Três formas de representar a mesma essência. O próximo passo também deve ser coletivo."}, "votacao": {"act": "Ato V · Construção coletiva", "t": "Agora, a trama é nossa.", "b": ["Retomar a transformação que motivou a identidade.", "Mesmo nome, manifesto e posicionamento; muda a expressão visual.", "<b>Ponto cruz:</b> artesanal + computacional, precisão e símbolo figurativo.", "<b>Laçada:</b> moda, modularidade, liberdade compositiva.", "<b>Ninho:</b> natureza, conexão, organicidade e colaboração.", "Votar além da preferência de cor: essência, convivência multimarcas, potencial de evolução."], "h": "Se queremos construir o DS coletivamente, faz sentido construir sua identidade da mesma forma."}, "resultados": {"act": "Ato V · Construção coletiva", "t": "Resultados / O próximo capítulo.", "b": ["Acompanhar os votos e abrir espaço para comentários.", "Entender quais conceitos geraram identificação.", "Valorizar diferentes perspectivas.", "Escolha como ponto de partida para refinamentos, não fim da construção."], "h": "Independentemente da expressão escolhida, o significado do Baya permanece."}, "encerramento": {"act": "Ato V · Construção coletiva", "t": "Encerramento", "b": ["Retomar a abertura: duas trajetórias, DS Apps e DS N Marcas.", "Evolução para um ecossistema unificado, federado e multiplataforma.", "Diferentes marcas, estrutura compartilhada, identidades preservadas.", "Baya representa essa evolução; agradecer a participação.", "<b>Diferentes identidades. Uma estrutura compartilhada. Infinitas possibilidades.</b>"], "h": ""}};
